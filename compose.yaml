services:
  kb:
    image: kb-mcp:cpu
    platform: linux/amd64
    build: .
    init: true
    stdin_open: true
    tty: true
    environment:
      KB_MODEL_PATH: models/bge-m3
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-4096}
    volumes:
      - type: bind
        source: ./models/bge-m3
        target: /app/models/bge-m3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./artifacts/docker_cpu
        target: /app/artifacts
      - type: bind
        source: ./reports
        target: /app/reports
      - type: bind
        source: ./logs
        target: /app/logs
